name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Windows tests and PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install latest stable Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - name: Run Windows PowerShell 5.1 tests
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\Test-InstallerConfig.ps1
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\Test-OnlineInstaller.ps1

  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            machine: "8664"
          - arch: x86
            target: i686-pc-windows-msvc
            machine: "014C"
          - arch: arm64
            target: aarch64-pc-windows-msvc
            machine: "AA64"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install target
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup target add ${{ matrix.target }}
          if ('${{ matrix.arch }}' -eq 'arm64') {
            cargo install --locked cargo-xwin --version 0.23.0
            $shim = Join-Path $env:RUNNER_TEMP 'lld-shim'
            New-Item -ItemType Directory -Path $shim -Force | Out-Null
            $rustLld = Join-Path (rustc --print sysroot) 'lib\rustlib\x86_64-pc-windows-msvc\bin\rust-lld.exe'
            Copy-Item $rustLld (Join-Path $shim 'lld-link.exe')
            $shim | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Build release binaries
        shell: pwsh
        run: |
          if ('${{ matrix.arch }}' -eq 'arm64') {
            cargo xwin build --release --locked --target ${{ matrix.target }}
          } else {
            cargo build --release --locked --target ${{ matrix.target }}
          }
      - name: Verify PE machine and version
        shell: pwsh
        run: |
          $expected = [Convert]::ToUInt16('${{ matrix.machine }}', 16)
          foreach ($name in @('rdpguard.exe', 'rdpguard-monitor.exe')) {
            $path = "target\${{ matrix.target }}\release\$name"
            $bytes = [IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            if ($machine -ne $expected) { throw "$name PE Machine is $machine; expected $expected" }
          }
          if ('${{ matrix.arch }}' -ne 'arm64') {
            & "target\${{ matrix.target }}\release\rdpguard.exe" --version
            if ($LASTEXITCODE -ne 0) { throw 'rdpguard --version failed' }
            & "target\${{ matrix.target }}\release\rdpguard-monitor.exe" --version
            if ($LASTEXITCODE -ne 0) { throw 'rdpguard-monitor --version failed' }
          }

  security:
    name: Dependency and workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install security tools
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
      - run: cargo audit
      - run: cargo deny check
      - name: Actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
