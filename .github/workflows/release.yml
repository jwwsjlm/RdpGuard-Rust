name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            machine: "8664"
          - arch: x86
            target: i686-pc-windows-msvc
            machine: "014C"
          - arch: arm64
            target: aarch64-pc-windows-msvc
            machine: "AA64"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust and tools
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup target add ${{ matrix.target }}
          cargo install --locked cargo-cyclonedx --version 0.5.9
          if ('${{ matrix.arch }}' -eq 'arm64') {
            cargo install --locked cargo-xwin --version 0.23.0
            $shim = Join-Path $env:RUNNER_TEMP 'lld-shim'
            New-Item -ItemType Directory -Path $shim -Force | Out-Null
            $rustLld = Join-Path (rustc --print sysroot) 'lib\rustlib\x86_64-pc-windows-msvc\bin\rust-lld.exe'
            Copy-Item $rustLld (Join-Path $shim 'lld-link.exe')
            $shim | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Verify source and tag
        shell: powershell
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'rdpguard' }
          if ($env:GITHUB_REF_NAME -ne "v$($package.version)") { throw 'Tag and Cargo version differ.' }
          if (-not ((Get-Content Install-RdpGuard-Online.ps1) -contains ('$ReleaseTag = ' + "'$env:GITHUB_REF_NAME'"))) { throw 'Online tag differs.' }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\Test-InstallerConfig.ps1
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\Test-OnlineInstaller.ps1
      - name: Build release binaries
        shell: pwsh
        run: |
          if ('${{ matrix.arch }}' -eq 'arm64') {
            cargo xwin build --release --locked --target ${{ matrix.target }}
          } else {
            cargo build --release --locked --target ${{ matrix.target }}
          }
      - name: Package and verify
        shell: pwsh
        run: |
          $expected = [Convert]::ToUInt16('${{ matrix.machine }}', 16)
          $root = Join-Path $env:RUNNER_TEMP 'RdpGuard-Rust'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          foreach ($name in @('rdpguard.exe', 'rdpguard-monitor.exe')) {
            $source = "target\${{ matrix.target }}\release\$name"
            $bytes = [IO.File]::ReadAllBytes($source)
            $pe = [BitConverter]::ToInt32($bytes, 0x3c)
            if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne $expected) { throw "$name has wrong PE Machine" }
            Copy-Item $source $root
          }
          if ('${{ matrix.arch }}' -ne 'arm64') {
            & (Join-Path $root 'rdpguard.exe') --version
            if ($LASTEXITCODE -ne 0) { throw 'service version smoke test failed' }
            & (Join-Path $root 'rdpguard-monitor.exe') --version
            if ($LASTEXITCODE -ne 0) { throw 'monitor version smoke test failed' }
          }
          foreach ($file in @('config.json','Install-RdpGuard.ps1','Install-RdpGuard-Online.ps1','Uninstall-RdpGuard.ps1','README.md','CHANGELOG.md','LICENSE','TEST-SUMMARY.md','SECURITY.md')) { Copy-Item $file $root }
          New-Item -ItemType Directory -Path (Join-Path $root 'docs') | Out-Null
          Copy-Item docs\ADVANCED.md (Join-Path $root 'docs')
          cargo cyclonedx --format json --target ${{ matrix.target }} --target-in-filename
          $sbom = Get-ChildItem -Filter '*.cdx.json' | Select-Object -First 1
          if (-not $sbom) { throw 'CycloneDX SBOM was not generated.' }
          $sbomName = "RdpGuard-Rust-$env:GITHUB_REF_NAME-windows-${{ matrix.arch }}.cdx.json"
          Copy-Item $sbom.FullName (Join-Path $env:RUNNER_TEMP $sbomName)
          $archiveName = "RdpGuard-Rust-$env:GITHUB_REF_NAME-windows-${{ matrix.arch }}.zip"
          Compress-Archive -LiteralPath $root -DestinationPath (Join-Path $env:RUNNER_TEMP $archiveName) -CompressionLevel Optimal
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP $archiveName) dist
          Copy-Item (Join-Path $env:RUNNER_TEMP $sbomName) dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.zip > SHA256SUMS.txt
      - name: Attest release archives
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* Install-RdpGuard-Online.ps1 \
            --repo "$GITHUB_REPOSITORY" --title "RdpGuard $GITHUB_REF_NAME" \
            --generate-notes --verify-tag --latest
