name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Publish Windows release
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install latest stable Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Verify tag matches Cargo version
        shell: pwsh
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'rdpguard' }
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $expectedTag"
          }

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build release executable
        run: cargo build --release --locked

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'RdpGuard-Rust'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $files = @(
              'target\release\rdpguard.exe',
              'target\release\rdpguard-monitor.exe',
              'config.json',
              'Install-RdpGuard.ps1',
              'Uninstall-RdpGuard.ps1',
              'README.md',
              'CHANGELOG.md',
              'LICENSE',
              'TEST-SUMMARY.md'
          )
          foreach ($file in $files) {
              Copy-Item -LiteralPath $file -Destination $staging
          }
          $stagingDocs = Join-Path $staging 'docs'
          New-Item -ItemType Directory -Path $stagingDocs -Force | Out-Null
          Copy-Item -LiteralPath 'docs\ADVANCED.md' -Destination $stagingDocs

          $archiveName = "RdpGuard-Rust-$env:GITHUB_REF_NAME.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $checksumPath = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          Compress-Archive -LiteralPath $staging -DestinationPath $archivePath -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -LiteralPath $checksumPath -Encoding ascii

          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
              $env:ARCHIVE_PATH `
              $env:CHECKSUM_PATH `
              --repo $env:GITHUB_REPOSITORY `
              --title "RdpGuard $env:GITHUB_REF_NAME" `
              --generate-notes `
              --verify-tag `
              --latest
