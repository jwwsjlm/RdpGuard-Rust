[package]
name = "rdpguard"
version = "0.2.1"
edition = "2024"
description = "Temporary Windows Firewall blocking for repeated RDP authentication failures"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
quick-xml = "0.41.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_EventLog",
] }
windows-service = "0.8.1"

[dev-dependencies]
tempfile = "3.27.0"
